appId: com.openwebui.tether
productName: Open WebUI Tether
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - '!node_modules/@microsoft/mxc-sdk/bin/!(${arch})/**'
  - '!node_modules/@microsoft/mxc-sdk/bin/**/*.{so,dylib}'
  - LICENSE
extraResources:
  - from: CHANGELOG.md
    to: CHANGELOG.md
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@microsoft/mxc-sdk/**
  - node_modules/koffi/**
  - resources/**
electronFuses:
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: tether
nsis:
  artifactName: ${name}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  files:
    - '!node_modules/@microsoft/mxc-sdk/**'
    - '!node_modules/koffi/**'
    - '!node_modules/@koromix/koffi-*/**'
  target:
    - target: dmg
    - target: zip
  artifactName: ${name}-${arch}-mac.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSLocationUsageDescription: Open WebUI Tether uses your location when you enable location sharing in Open WebUI.
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  background: build/dmg-background.png
  artifactName: ${name}-${arch}.${ext}
  title: ${productName}
  contents:
    - x: 225
      y: 250
      type: file
    - x: 400
      y: 240
      type: link
      path: /Applications
linux:
  files:
    - '!node_modules/@microsoft/mxc-sdk/**'
    - '!node_modules/koffi/**'
    - '!node_modules/@koromix/koffi-*/**'
  target:
    - AppImage
    - snap
    - deb
    - flatpak
  maintainer: openwebui.com
  category: Utility
deb:
  artifactName: ${name}_${arch}.${ext}
snap:
  # Keep native dependencies compatible with the Linux x64 build runner.
  base: core22
  artifactName: ${name}_${arch}.${ext}
appImage:
  artifactName: ${name}_${arch}.${ext}
flatpak:
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '25.08'
  runtime: org.freedesktop.Platform
  runtimeVersion: '25.08'
  sdk: org.freedesktop.Sdk
  artifactName: ${name}.flatpak
  finishArgs:
    - --share=ipc
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --share=network
    - --device=dri
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.freedesktop.portal.Desktop
npmRebuild: true
publish:
  provider: github
  owner: open-webui
  repo: tether
